<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fazendinha do Kevin Brian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800;900&family=Nunito:wght@600;700&display=swap">
<meta http-equiv="refresh" content="3;url=/festa-kevin/">
<style>
:root{
  --ceu-alto:#a9daf2; --ceu-baixo:#dff0fa; --creme:#fdf3df; --papel:#fffaef;
  --azul:#2a6db5; --azul-fundo:#17497f; --verde-fundo:#42813a;
  --tinta:#3b2a1b; --tinta-suave:#6f5a44; --linha:rgba(154,114,71,.28);
}
*{box-sizing:border-box}
html{background:var(--ceu-alto)}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(to bottom,var(--ceu-alto) 0,var(--ceu-baixo) 40%,var(--creme) 78%) no-repeat fixed;
  background-color:var(--creme);
  color:var(--tinta);font-family:"Nunito",ui-rounded,"Avenir Next",system-ui,sans-serif;
  font-size:16px;line-height:1.55;text-align:center;-webkit-font-smoothing:antialiased;
}
.caixa{
  max-width:400px;background:var(--papel);border:2px dashed var(--linha);border-radius:22px;
  padding:32px 24px;box-shadow:0 10px 28px -14px rgba(59,42,27,.45);
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
h1{font-family:"Grandstander",cursive;font-weight:900;font-size:1.5rem;margin:0;color:var(--azul-fundo);text-wrap:balance}
p{margin:0;color:var(--tinta-suave);font-size:.98rem;max-width:32ch}
a.botao{
  margin-top:6px;text-decoration:none;font-family:"Grandstander",cursive;font-weight:900;font-size:1.1rem;
  color:#fff;background:linear-gradient(180deg,#8ecf68,var(--verde-fundo));
  padding:15px 26px;border-radius:18px;box-shadow:0 6px 0 #2f6229;
}
a.botao:active{transform:translateY(4px);box-shadow:0 2px 0 #2f6229}
.bicho{font-size:2.6rem;line-height:1}
</style>
</head>
<body>
  <div class="caixa">
    <div class="bicho" aria-hidden="true">🐄</div>
    <h1>Esse endereço não existe</h1>
    <p>Mas o convite do Kevin Brian está logo ali. Você vai ser levado pra lá em alguns segundos.</p>
    <a class="botao" href="/festa-kevin/">Ver o convite</a>
  </div>
</body>
</html>
